# EAS Build — dispatch or product orchestrator
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - development
          - production
        default: preview
      ios:
        description: Build iOS
        required: true
        type: boolean
        default: false
      android:
        description: Build Android
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: string
      ios:
        description: Build iOS
        required: true
        type: boolean
      android:
        description: Build Android
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one platform
        run: |
          if [ "${{ inputs.ios }}" != "true" ] && [ "${{ inputs.android }}" != "true" ]; then
            echo "::error::Select at least one of ios or android"
            exit 1
          fi

  build-ios:
    name: Build iOS (${{ inputs.profile }})
    needs: validate
    if: ${{ inputs.ios == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: native/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        working-directory: native
        run: pnpm install --frozen-lockfile

      - name: Build iOS on EAS
        working-directory: native
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive

  build-android:
    name: Build Android (${{ inputs.profile }})
    needs: validate
    if: ${{ inputs.android == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: native/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        working-directory: native
        run: pnpm install --frozen-lockfile

      - name: Build Android on EAS
        working-directory: native
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive
